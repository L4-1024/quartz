<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>Obsidian 核心概念导览图</title>
  <desc>Vault、Markdown、双链、标签、属性与插件系统的关系示意</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2e8"/>
      <stop offset="100%" stop-color="#e4efe9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8c6c3b"/>
      <stop offset="100%" stop-color="#1f3d36"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="160" r="170" fill="#8c6c3b" opacity="0.12"/>
  <circle cx="220" cy="790" r="210" fill="#2f7f6d" opacity="0.08"/>
  <rect x="72" y="72" width="1456" height="756" rx="34" fill="#fffdf8" opacity="0.96"/>
  <rect x="110" y="110" width="1380" height="210" rx="28" fill="url(#hero)"/>
  <text x="160" y="165" fill="#f2e8d9" font-size="24" font-family="'Noto Sans CJK SC',sans-serif" letter-spacing="6">OBSIDIAN WECHAT ALBUM</text>
  <text x="160" y="235" fill="#ffffff" font-size="50" font-weight="700" font-family="'Noto Serif CJK SC',serif">Obsidian 核心概念导览图</text>
  <text x="160" y="283" fill="#e7f1ec" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">先理解库、文件、链接、标签、属性和插件分别在系统里承担什么角色</text>
  <rect x="160" y="298" width="320" height="8" rx="4" fill="#f4c95d"/>

  <rect x="120" y="380" width="240" height="260" rx="28" fill="#f4efe5"/>
  <text x="150" y="435" fill="#6f4a1f" font-size="30" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">Vault</text>
  <text x="150" y="485" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">知识库的根目录</text>
  <text x="150" y="520" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">里面包含笔记、附件和配置</text>

  <rect x="390" y="380" width="240" height="260" rx="28" fill="#eef4f7"/>
  <text x="420" y="435" fill="#27435e" font-size="30" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">Markdown</text>
  <text x="420" y="485" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">笔记的底层文件格式</text>
  <text x="420" y="520" fill="#27435e" font-size="18" font-family="'Noto Sans CJK SC',sans-serif">可迁移、可阅读、可版本管理</text>

  <rect x="660" y="380" width="280" height="260" rx="28" fill="#ebf5ef"/>
  <text x="690" y="435" fill="#1f5b4a" font-size="30" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">双链与反向链接</text>
  <text x="690" y="485" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">负责建立笔记之间的关系</text>
  <text x="690" y="520" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">把零散页面连成知识网络</text>

  <rect x="970" y="380" width="240" height="260" rx="28" fill="#f1edfa"/>
  <text x="1000" y="435" fill="#4a3a72" font-size="30" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">标签</text>
  <text x="1000" y="485" fill="#4a3a72" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">跨文件夹分类</text>
  <text x="1000" y="520" fill="#4a3a72" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">适合做主题和状态检索</text>

  <rect x="1240" y="380" width="240" height="260" rx="28" fill="#eef4f7"/>
  <text x="1270" y="435" fill="#27435e" font-size="30" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">属性</text>
  <text x="1270" y="485" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">结构化元数据</text>
  <text x="1270" y="520" fill="#27435e" font-size="18" font-family="'Noto Sans CJK SC',sans-serif">适合查询、筛选和视图管理</text>

  <rect x="430" y="675" width="740" height="90" rx="24" fill="#fff8e8"/>
  <text x="470" y="730" fill="#6f4a1f" font-size="24" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">插件系统</text>
  <text x="620" y="730" fill="#6f4a1f" font-size="20" font-family="'Noto Sans CJK SC',sans-serif">在核心概念之上扩展功能，但前提是先把基础系统用顺</text>
</svg>
