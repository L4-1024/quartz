<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>附件目录、嵌入方式与命名策略</title>
  <desc>附件与图片管理规范</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2e8"/>
      <stop offset="100%" stop-color="#e4efe9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5d4b8a"/>
      <stop offset="100%" stop-color="#1f3d36"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="160" r="170" fill="#5d4b8a" opacity="0.14"/>
  <circle cx="230" cy="790" r="210" fill="#2f7f6d" opacity="0.10"/>
  <rect x="72" y="72" width="1456" height="756" rx="34" fill="#fffdf8" opacity="0.96"/>
  <rect x="110" y="110" width="1380" height="210" rx="28" fill="url(#hero)"/>
  <text x="160" y="165" fill="#ece5fb" font-size="24" font-family="'Noto Sans CJK SC',sans-serif" letter-spacing="6">OBSIDIAN WECHAT ALBUM</text>
  <text x="160" y="235" fill="#ffffff" font-size="58" font-weight="700" font-family="'Noto Serif CJK SC',serif">附件目录、嵌入方式与命名策略</text>
  <text x="160" y="283" fill="#e7f1ec" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">整理截图、图片和附件时，核心是统一位置、统一命名、统一引用</text>
  <rect x="160" y="298" width="300" height="8" rx="4" fill="#f4c95d"/>

  <rect x="110" y="350" width="430" height="420" rx="28" fill="#f1edfa"/>
  <text x="145" y="400" fill="#4a3a72" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">统一位置</text>
  <rect x="145" y="435" width="360" height="88" rx="18" fill="#ffffff"/>
  <text x="170" y="485" fill="#4a3a72" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">附件根目录建议放在 assets/</text>
  <rect x="145" y="540" width="360" height="88" rx="18" fill="#ffffff"/>
  <text x="170" y="590" fill="#4a3a72" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">避免每篇笔记都散落一套图片</text>
  <rect x="145" y="645" width="360" height="88" rx="18" fill="#ffffff"/>
  <text x="170" y="695" fill="#4a3a72" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">便于迁移与批量清理</text>

  <rect x="570" y="350" width="430" height="420" rx="28" fill="#eef4f7"/>
  <text x="605" y="400" fill="#27435e" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">统一引用</text>
  <rect x="605" y="435" width="360" height="88" rx="18" fill="#ffffff"/>
  <text x="630" y="485" fill="#27435e" font-size="19" font-family="'JetBrains Mono','Consolas',monospace">![[image.png]]</text>
  <rect x="605" y="540" width="360" height="88" rx="18" fill="#ffffff"/>
  <text x="630" y="590" fill="#27435e" font-size="19" font-family="'JetBrains Mono','Consolas',monospace">![[image.png|320]]</text>
  <rect x="605" y="645" width="360" height="88" rx="18" fill="#ffffff"/>
  <text x="630" y="695" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">![[diagram.svg|流程示意]]</text>

  <rect x="1030" y="350" width="460" height="420" rx="28" fill="#ebf5ef"/>
  <text x="1065" y="400" fill="#1f5b4a" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">统一命名</text>
  <rect x="1065" y="435" width="390" height="88" rx="18" fill="#ffffff"/>
  <text x="1090" y="472" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">推荐</text>
  <text x="1160" y="472" fill="#1f5b4a" font-size="20" font-family="'JetBrains Mono','Consolas',monospace">2026-04-note-cover.png</text>
  <rect x="1065" y="540" width="390" height="88" rx="18" fill="#ffffff"/>
