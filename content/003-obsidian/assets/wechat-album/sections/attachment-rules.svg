  <text x="1160" y="577" fill="#1f5b4a" font-size="20" font-family="'Noto Sans CJK SC',sans-serif">截图1 / IMG_1234</text>
  <rect x="1065" y="645" width="390" height="88" rx="18" fill="#ffffff"/>
  <text x="1090" y="682" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">原则</text>
  <text x="1160" y="682" fill="#1f5b4a" font-size="20" font-family="'Noto Sans CJK SC',sans-serif">文件名能看懂用途</text>
