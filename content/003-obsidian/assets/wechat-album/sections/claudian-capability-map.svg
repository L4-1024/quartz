  <text x="120" y="205" fill="#6b8393" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">把 AI 助手在 Obsidian 中的常见能力拆成 4 个模块</text>
  <g font-family="'Noto Sans CJK SC',sans-serif">
