  <rect x="1065" y="645" width="390" height="86" rx="18" fill="#fffdf8"/>
  <text x="1090" y="695" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">排版稳定后再考虑自动格式化</text>
