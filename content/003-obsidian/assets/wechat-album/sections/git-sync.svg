<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>本地仓库、远程仓库与自动同步策略</title>
  <desc>Obsidian Git 同步与版本管理</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2e8"/>
      <stop offset="100%" stop-color="#e4efe9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#975a3e"/>
      <stop offset="100%" stop-color="#1f3d36"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="160" r="170" fill="#975a3e" opacity="0.14"/>
  <circle cx="220" cy="790" r="210" fill="#2f7f6d" opacity="0.10"/>
  <rect x="72" y="72" width="1456" height="756" rx="34" fill="#fffdf8" opacity="0.96"/>
  <rect x="110" y="110" width="1380" height="210" rx="28" fill="url(#hero)"/>
  <text x="160" y="165" fill="#f2e8d9" font-size="24" font-family="'Noto Sans CJK SC',sans-serif" letter-spacing="6">OBSIDIAN WECHAT ALBUM</text>
  <text x="160" y="235" fill="#ffffff" font-size="50" font-weight="700" font-family="'Noto Serif CJK SC',serif">本地仓库、远程仓库与自动同步策略</text>
  <text x="160" y="283" fill="#e7f1ec" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">同步本质上是“提交、上传、拉取”的节奏设计，而不只是点一次按钮</text>
  <rect x="160" y="298" width="320" height="8" rx="4" fill="#f4c95d"/>

  <rect x="110" y="350" width="430" height="420" rx="28" fill="#f4efe5"/>
  <text x="145" y="400" fill="#6f4a1f" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">本地仓库</text>
  <rect x="145" y="435" width="360" height="86" rx="18" fill="#fffdf8"/>
  <text x="170" y="485" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">记录每次修改的历史快照</text>
  <rect x="145" y="540" width="360" height="86" rx="18" fill="#fffdf8"/>
  <text x="170" y="590" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">适合回滚、比对、排查误删</text>
  <rect x="145" y="645" width="360" height="86" rx="18" fill="#fffdf8"/>
  <text x="170" y="695" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">提交前先确认变更范围</text>

  <rect x="570" y="350" width="430" height="420" rx="28" fill="#eef4f7"/>
  <text x="605" y="400" fill="#27435e" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">远程仓库</text>
  <rect x="605" y="435" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="630" y="485" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">作为异地备份和多端同步中心</text>
  <rect x="605" y="540" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="630" y="590" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">推送前先拉取，避免覆盖他处修改</text>
  <rect x="605" y="645" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="630" y="695" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">关注认证方式和网络稳定性</text>

  <rect x="1030" y="350" width="460" height="420" rx="28" fill="#ebf5ef"/>
  <text x="1065" y="400" fill="#1f5b4a" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">自动同步策略</text>
  <rect x="1065" y="435" width="390" height="86" rx="18" fill="#ffffff"/>
  <text x="1090" y="485" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">固定间隔自动 commit 和 push</text>
  <rect x="1065" y="540" width="390" height="86" rx="18" fill="#ffffff"/>
  <text x="1090" y="590" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">多设备并用时先 pull 再继续编辑</text>
  <rect x="1065" y="645" width="390" height="86" rx="18" fill="#ffffff"/>
  <text x="1090" y="695" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">冲突出现时优先人工确认再合并</text>
</svg>
