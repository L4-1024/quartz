<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>本地词典、云端词典与切换判断</title>
  <desc>I18N 插件工作模式与使用场景示意</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2e8"/>
      <stop offset="100%" stop-color="#e4efe9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#49677a"/>
      <stop offset="100%" stop-color="#1f3d36"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1370" cy="150" r="170" fill="#49677a" opacity="0.14"/>
  <circle cx="240" cy="790" r="200" fill="#2f7f6d" opacity="0.10"/>
  <rect x="72" y="72" width="1456" height="756" rx="34" fill="#fffdf8" opacity="0.96"/>
  <rect x="110" y="110" width="1380" height="210" rx="28" fill="url(#hero)"/>
  <text x="160" y="165" fill="#dceaf1" font-size="24" font-family="'Noto Sans CJK SC',sans-serif" letter-spacing="6">OBSIDIAN WECHAT ALBUM</text>
  <text x="160" y="235" fill="#ffffff" font-size="58" font-weight="700" font-family="'Noto Serif CJK SC',serif">本地词典、云端词典与切换判断</text>
  <text x="160" y="283" fill="#e7f1ec" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">选对模式，才能兼顾翻译覆盖率、稳定性和加载速度</text>
  <rect x="160" y="298" width="270" height="8" rx="4" fill="#f4c95d"/>

  <rect x="110" y="350" width="420" height="420" rx="28" fill="#eef4f7"/>
  <text x="145" y="400" fill="#27435e" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">本地模式</text>
  <rect x="145" y="435" width="350" height="84" rx="18" fill="#ffffff"/>
  <text x="170" y="482" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">优点：离线可用，切换稳定</text>
  <rect x="145" y="535" width="350" height="84" rx="18" fill="#ffffff"/>
  <text x="170" y="582" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">适合：办公网、弱网环境</text>
  <rect x="145" y="635" width="350" height="84" rx="18" fill="#ffffff"/>
  <text x="170" y="682" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">限制：词条更新通常较慢</text>

  <rect x="560" y="350" width="420" height="420" rx="28" fill="#ebf5ef"/>
  <text x="595" y="400" fill="#1f5b4a" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">云端模式</text>
  <rect x="595" y="435" width="350" height="84" rx="18" fill="#ffffff"/>
  <text x="620" y="482" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">优点：词典覆盖更全、更新更快</text>
  <rect x="595" y="535" width="350" height="84" rx="18" fill="#ffffff"/>
  <text x="620" y="582" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">适合：经常装新插件的用户</text>
  <rect x="595" y="635" width="350" height="84" rx="18" fill="#ffffff"/>
  <text x="620" y="682" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">限制：依赖网络，首次加载较慢</text>

  <rect x="1010" y="350" width="480" height="420" rx="28" fill="#f4efe5"/>
  <text x="1045" y="400" fill="#6f4a1f" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">选择建议</text>
  <rect x="1045" y="435" width="410" height="82" rx="18" fill="#fffdf8"/>
  <text x="1070" y="482" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">先用本地模式完成基础设置</text>
  <rect x="1045" y="532" width="410" height="82" rx="18" fill="#fffdf8"/>
  <text x="1070" y="579" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">需要更完整翻译时再切到云端</text>
  <rect x="1045" y="629" width="410" height="82" rx="18" fill="#fffdf8"/>
  <text x="1070" y="676" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">加载异常时优先检查网络与词典状态</text>
</svg>
