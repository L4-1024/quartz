<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>Markdown 幻灯片结构、导出与演示场景</title>
  <desc>Marp Slides 工作流</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2e8"/>
      <stop offset="100%" stop-color="#e4efe9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#975a3e"/>
      <stop offset="100%" stop-color="#1f3d36"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="160" r="170" fill="#975a3e" opacity="0.14"/>
  <circle cx="220" cy="790" r="210" fill="#2f7f6d" opacity="0.10"/>
  <rect x="72" y="72" width="1456" height="756" rx="34" fill="#fffdf8" opacity="0.96"/>
  <rect x="110" y="110" width="1380" height="210" rx="28" fill="url(#hero)"/>
  <text x="160" y="165" fill="#f2e8d9" font-size="24" font-family="'Noto Sans CJK SC',sans-serif" letter-spacing="6">OBSIDIAN WECHAT ALBUM</text>
  <text x="160" y="235" fill="#ffffff" font-size="50" font-weight="700" font-family="'Noto Serif CJK SC',serif">Markdown 幻灯片结构、导出与演示场景</text>
  <text x="160" y="283" fill="#e7f1ec" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">Marp 的优势在于用一套 Markdown 内容同时兼顾写作、演示和导出</text>
  <rect x="160" y="298" width="320" height="8" rx="4" fill="#f4c95d"/>

  <rect x="110" y="350" width="430" height="420" rx="28" fill="#f4efe5"/>
  <text x="145" y="400" fill="#6f4a1f" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">内容结构</text>
  <rect x="145" y="435" width="360" height="86" rx="18" fill="#fffdf8"/>
  <text x="170" y="485" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">一页一段主题，避免信息塞满</text>
  <rect x="145" y="540" width="360" height="86" rx="18" fill="#fffdf8"/>
  <text x="170" y="590" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">标题、要点、图示保持稳定节奏</text>
  <rect x="145" y="645" width="360" height="86" rx="18" fill="#fffdf8"/>
  <text x="170" y="695" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">适合从现有笔记继续改造成幻灯片</text>

  <rect x="570" y="350" width="430" height="420" rx="28" fill="#eef4f7"/>
  <text x="605" y="400" fill="#27435e" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">导出路径</text>
  <rect x="605" y="435" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="630" y="485" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">可导出 HTML、PDF、PPT 等形式</text>
  <rect x="605" y="540" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="630" y="590" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">适合演示前快速复查页面效果</text>
  <rect x="605" y="645" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="630" y="695" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">一处改动可同步影响多个输出</text>

  <rect x="1030" y="350" width="460" height="420" rx="28" fill="#ebf5ef"/>
  <text x="1065" y="400" fill="#1f5b4a" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">适用场景</text>
  <rect x="1065" y="435" width="390" height="86" rx="18" fill="#ffffff"/>
  <text x="1090" y="485" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">内部分享、读书会、方案讲解</text>
  <rect x="1065" y="540" width="390" height="86" rx="18" fill="#ffffff"/>
  <text x="1090" y="590" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">适合偏结构化、文字驱动的内容</text>
  <rect x="1065" y="645" width="390" height="86" rx="18" fill="#ffffff"/>
  <text x="1090" y="695" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">不适合高度复杂的自由排版演示</text>
</svg>
