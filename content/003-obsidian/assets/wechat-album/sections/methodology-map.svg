<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>从轻量使用到逐步扩展的学习路径</title>
  <desc>Obsidian 方法论与上手原则</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2e8"/>
      <stop offset="100%" stop-color="#e4efe9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f7f6d"/>
      <stop offset="100%" stop-color="#1f3d36"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="160" r="170" fill="#2f7f6d" opacity="0.14"/>
  <circle cx="220" cy="790" r="210" fill="#2f7f6d" opacity="0.10"/>
  <rect x="72" y="72" width="1456" height="756" rx="34" fill="#fffdf8" opacity="0.96"/>
  <rect x="110" y="110" width="1380" height="210" rx="28" fill="url(#hero)"/>
  <text x="160" y="165" fill="#dcefe8" font-size="24" font-family="'Noto Sans CJK SC',sans-serif" letter-spacing="6">OBSIDIAN WECHAT ALBUM</text>
  <text x="160" y="235" fill="#ffffff" font-size="50" font-weight="700" font-family="'Noto Serif CJK SC',serif">从轻量使用到逐步扩展的学习路径</text>
  <text x="160" y="283" fill="#d9ece6" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">不要一开始就追求完整系统，先解决真实问题，再逐步扩展结构</text>
  <rect x="160" y="298" width="320" height="8" rx="4" fill="#f4c95d"/>

  <rect x="110" y="350" width="430" height="420" rx="28" fill="#ebf5ef"/>
  <text x="145" y="400" fill="#1f5b4a" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">第一阶段</text>
  <rect x="145" y="435" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="170" y="485" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">先会写笔记、搜索、链接、插图</text>
  <rect x="145" y="540" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="170" y="590" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">建立最小可用目录和模板</text>
  <rect x="145" y="645" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="170" y="695" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">目标是顺手记录，而不是完美整理</text>

  <rect x="570" y="350" width="430" height="420" rx="28" fill="#eef4f7"/>
  <text x="605" y="400" fill="#27435e" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">第二阶段</text>
  <rect x="605" y="435" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="630" y="485" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">加入标签、属性、任务和模板系统</text>
  <rect x="605" y="540" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="630" y="590" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">开始形成固定整理流程</text>
  <rect x="605" y="645" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="630" y="695" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">目标是提升复用率和检索效率</text>

  <rect x="1030" y="350" width="460" height="420" rx="28" fill="#f4efe5"/>
  <text x="1065" y="400" fill="#6f4a1f" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">第三阶段</text>
  <rect x="1065" y="435" width="390" height="86" rx="18" fill="#fffdf8"/>
  <text x="1090" y="485" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">再接入数据库、自动化、同步和发布</text>
  <rect x="1065" y="540" width="390" height="86" rx="18" fill="#fffdf8"/>
  <text x="1090" y="590" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">让知识库进入长期维护状态</text>
  <rect x="1065" y="645" width="390" height="86" rx="18" fill="#fffdf8"/>
  <text x="1090" y="695" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">目标是输出能力，而不只是存档</text>
</svg>
