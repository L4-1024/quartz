<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>插件目录、关键文件与启用顺序</title>
  <desc>社区插件手动安装结构示意</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2e8"/>
      <stop offset="100%" stop-color="#e4efe9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#975a3e"/>
      <stop offset="100%" stop-color="#1f3d36"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="150" r="170" fill="#975a3e" opacity="0.14"/>
  <circle cx="240" cy="780" r="210" fill="#2f7f6d" opacity="0.10"/>
  <rect x="72" y="72" width="1456" height="756" rx="34" fill="#fffdf8" opacity="0.96"/>
  <rect x="110" y="110" width="1380" height="210" rx="28" fill="url(#hero)"/>
  <text x="160" y="165" fill="#f2e8d9" font-size="24" font-family="'Noto Sans CJK SC',sans-serif" letter-spacing="6">OBSIDIAN WECHAT ALBUM</text>
  <text x="160" y="235" fill="#ffffff" font-size="58" font-weight="700" font-family="'Noto Serif CJK SC',serif">插件目录、关键文件与启用顺序</text>
  <text x="160" y="283" fill="#e7f1ec" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">手动安装时，重点不是“解压”，而是放对目录与文件</text>
  <rect x="160" y="298" width="280" height="8" rx="4" fill="#f4c95d"/>

  <rect x="110" y="350" width="460" height="420" rx="28" fill="#f4efe5"/>
  <text x="145" y="400" fill="#6f4a1f" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">目标目录</text>
  <rect x="145" y="435" width="390" height="290" rx="18" fill="#fffdf8"/>
  <text x="175" y="490" fill="#6f4a1f" font-size="24" font-family="'JetBrains Mono','Consolas',monospace">.obsidian/</text>
  <text x="215" y="540" fill="#6f4a1f" font-size="26" font-family="'JetBrains Mono','Consolas',monospace">plugins/</text>
  <text x="255" y="590" fill="#6f4a1f" font-size="24" font-family="'JetBrains Mono','Consolas',monospace">plugin-name/</text>
  <text x="295" y="635" fill="#6f4a1f" font-size="19" font-family="'JetBrains Mono','Consolas',monospace">main.js</text>
  <text x="295" y="668" fill="#6f4a1f" font-size="19" font-family="'JetBrains Mono','Consolas',monospace">manifest.json</text>
  <text x="295" y="701" fill="#6f4a1f" font-size="19" font-family="'JetBrains Mono','Consolas',monospace">style.css</text>

  <rect x="600" y="350" width="380" height="420" rx="28" fill="#eef4f7"/>
  <text x="635" y="400" fill="#27435e" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">安装顺序</text>
  <rect x="635" y="435" width="310" height="72" rx="18" fill="#ffffff"/>
  <text x="662" y="480" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">1. 下载发布文件</text>
  <rect x="635" y="525" width="310" height="72" rx="18" fill="#ffffff"/>
  <text x="662" y="570" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">2. 建立插件目录</text>
  <rect x="635" y="615" width="310" height="72" rx="18" fill="#ffffff"/>
  <text x="662" y="660" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">3. 重启并启用</text>

  <rect x="1010" y="350" width="480" height="420" rx="28" fill="#ebf5ef"/>
  <text x="1045" y="400" fill="#1f5b4a" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">易错点</text>
  <rect x="1045" y="435" width="410" height="82" rx="18" fill="#ffffff"/>
  <text x="1070" y="482" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">下载了源码压缩包，而不是发布文件</text>
  <rect x="1045" y="532" width="410" height="82" rx="18" fill="#ffffff"/>
  <text x="1070" y="579" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">多套目录嵌套，导致插件无法识别</text>
  <rect x="1045" y="629" width="410" height="82" rx="18" fill="#ffffff"/>
  <text x="1070" y="676" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">缺少 manifest.json 或 main.js</text>
</svg>
