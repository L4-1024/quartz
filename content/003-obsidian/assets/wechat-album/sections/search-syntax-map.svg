<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>关键词、标签与路径组合检索</title>
  <desc>Obsidian 搜索语法与筛选入口示意</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2e8"/>
      <stop offset="100%" stop-color="#e4efe9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d5a80"/>
      <stop offset="100%" stop-color="#1f3d36"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="150" r="170" fill="#3d5a80" opacity="0.14"/>
  <circle cx="220" cy="780" r="200" fill="#2f7f6d" opacity="0.10"/>
  <rect x="72" y="72" width="1456" height="756" rx="34" fill="#fffdf8" opacity="0.96"/>
  <rect x="110" y="110" width="1380" height="220" rx="28" fill="url(#hero)"/>
  <text x="160" y="165" fill="#dcefe8" font-size="24" font-family="'Noto Sans CJK SC',sans-serif" letter-spacing="6">OBSIDIAN WECHAT ALBUM</text>
  <text x="160" y="235" fill="#ffffff" font-size="60" font-weight="700" font-family="'Noto Serif CJK SC',serif">关键词、标签与路径组合检索</text>
  <text x="160" y="285" fill="#d9ece6" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">把搜索入口、常用语法和组合筛选放进同一张图里</text>
  <rect x="160" y="305" width="260" height="8" rx="4" fill="#f4c95d"/>

  <rect x="110" y="370" width="420" height="380" rx="28" fill="#eef4f7"/>
  <text x="145" y="420" fill="#27435e" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">三个入口</text>
  <rect x="145" y="450" width="350" height="70" rx="18" fill="#ffffff"/>
  <text x="170" y="494" fill="#234" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">快速切换器</text>
  <text x="370" y="494" fill="#3d5a80" font-size="19" font-family="'JetBrains Mono','Consolas',monospace">Ctrl/Cmd + O</text>
  <rect x="145" y="540" width="350" height="70" rx="18" fill="#ffffff"/>
  <text x="170" y="584" fill="#234" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">当前文件搜索</text>
  <text x="360" y="584" fill="#3d5a80" font-size="19" font-family="'JetBrains Mono','Consolas',monospace">Ctrl/Cmd + F</text>
  <rect x="145" y="630" width="350" height="70" rx="18" fill="#ffffff"/>
  <text x="170" y="674" fill="#234" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">全局搜索</text>
  <text x="345" y="674" fill="#3d5a80" font-size="19" font-family="'JetBrains Mono','Consolas',monospace">Ctrl/Cmd + Shift + F</text>

  <rect x="540" y="370" width="450" height="380" rx="28" fill="#f4efe5"/>
  <text x="595" y="420" fill="#6f4a1f" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">常用语法</text>
  <rect x="575" y="450" width="380" height="58" rx="14" fill="#fffdf8"/>
  <text x="600" y="487" fill="#6f4a1f" font-size="17" font-family="'Noto Sans CJK SC',sans-serif">file:周报 OR tag:#工作</text>
  <rect x="575" y="526" width="380" height="58" rx="14" fill="#fffdf8"/>
  <text x="600" y="563" fill="#6f4a1f" font-size="17" font-family="'Noto Sans CJK SC',sans-serif">path:项目/产品</text>
  <rect x="575" y="602" width="380" height="58" rx="14" fill="#fffdf8"/>
  <text x="600" y="639" fill="#6f4a1f" font-size="17" font-family="'Noto Sans CJK SC',sans-serif">inlinks:[[主题页]]</text>
  <rect x="575" y="678" width="380" height="58" rx="14" fill="#fffdf8"/>
  <text x="600" y="715" fill="#6f4a1f" font-size="17" font-family="'JetBrains Mono','Consolas',monospace">created:this-week</text>

  <rect x="1020" y="370" width="470" height="380" rx="28" fill="#ebf5ef"/>
  <text x="1055" y="420" fill="#1f5b4a" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">组合思路</text>
  <rect x="1055" y="455" width="400" height="78" rx="18" fill="#ffffff"/>
  <text x="1080" y="490" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">先缩小范围</text>
  <text x="1080" y="518" fill="#1f5b4a" font-size="18" font-family="'Noto Sans CJK SC',sans-serif">path:项目</text>
  <rect x="1055" y="545" width="400" height="78" rx="18" fill="#ffffff"/>
  <text x="1080" y="580" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">再加主题标签</text>
  <text x="1080" y="608" fill="#1f5b4a" font-size="18" font-family="'Noto Sans CJK SC',sans-serif">AND tag:#复盘</text>
  <rect x="1055" y="635" width="400" height="78" rx="18" fill="#ffffff"/>
  <text x="1080" y="670" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">最后排除噪音</text>
  <text x="1080" y="698" fill="#1f5b4a" font-size="18" font-family="'Noto Sans CJK SC',sans-serif">-path:归档</text>
</svg>
