<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>官方同步、第三方同步与 Git 方案差异</title>
  <desc>手机端同步方案对比</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2e8"/>
      <stop offset="100%" stop-color="#e4efe9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f7f6d"/>
      <stop offset="100%" stop-color="#1f3d36"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="160" r="170" fill="#2f7f6d" opacity="0.14"/>
  <circle cx="220" cy="790" r="210" fill="#2f7f6d" opacity="0.10"/>
  <rect x="72" y="72" width="1456" height="756" rx="34" fill="#fffdf8" opacity="0.96"/>
  <rect x="110" y="110" width="1380" height="210" rx="28" fill="url(#hero)"/>
  <text x="160" y="165" fill="#dcefe8" font-size="24" font-family="'Noto Sans CJK SC',sans-serif" letter-spacing="6">OBSIDIAN WECHAT ALBUM</text>
  <text x="160" y="235" fill="#ffffff" font-size="50" font-weight="700" font-family="'Noto Serif CJK SC',serif">官方同步、第三方同步与 Git 方案差异</text>
  <text x="160" y="283" fill="#d9ece6" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">同步方案没有绝对最优，关键看设备数量、网络环境和容错要求</text>
  <rect x="160" y="298" width="320" height="8" rx="4" fill="#f4c95d"/>

  <rect x="110" y="350" width="430" height="420" rx="28" fill="#ebf5ef"/>
  <text x="145" y="400" fill="#1f5b4a" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">官方同步</text>
  <rect x="145" y="435" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="170" y="485" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">配置最省心，桌面和移动端体验统一</text>
  <rect x="145" y="540" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="170" y="590" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">适合不想折腾同步细节的用户</text>
  <rect x="145" y="645" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="170" y="695" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">成本通常高于其他方案</text>

  <rect x="570" y="350" width="430" height="420" rx="28" fill="#eef4f7"/>
  <text x="605" y="400" fill="#27435e" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">第三方同步</text>
  <rect x="605" y="435" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="630" y="485" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">选择更多，适合已有云盘或对象存储</text>
  <rect x="605" y="540" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="630" y="590" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">配置细节和稳定性依赖具体插件</text>
  <rect x="605" y="645" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="630" y="695" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">适合愿意自己维护同步链路的人</text>

  <rect x="1030" y="350" width="460" height="420" rx="28" fill="#f4efe5"/>
  <text x="1065" y="400" fill="#6f4a1f" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">Git 方案</text>
  <rect x="1065" y="435" width="390" height="86" rx="18" fill="#fffdf8"/>
  <text x="1090" y="485" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">适合重视版本历史和可回滚能力</text>
  <rect x="1065" y="540" width="390" height="86" rx="18" fill="#fffdf8"/>
  <text x="1090" y="590" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">多端并行编辑时要注意冲突处理</text>
  <rect x="1065" y="645" width="390" height="86" rx="18" fill="#fffdf8"/>
  <text x="1090" y="695" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">更偏工程化，不是纯傻瓜方案</text>
</svg>
