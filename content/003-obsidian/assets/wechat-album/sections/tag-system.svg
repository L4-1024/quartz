<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>标签命名、层级与检索策略</title>
  <desc>Obsidian 标签系统设计</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2e8"/>
      <stop offset="100%" stop-color="#e4efe9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#556b2f"/>
      <stop offset="100%" stop-color="#1f3d36"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="160" r="170" fill="#556b2f" opacity="0.14"/>
  <circle cx="220" cy="790" r="210" fill="#2f7f6d" opacity="0.10"/>
  <rect x="72" y="72" width="1456" height="756" rx="34" fill="#fffdf8" opacity="0.96"/>
  <rect x="110" y="110" width="1380" height="210" rx="28" fill="url(#hero)"/>
  <text x="160" y="165" fill="#e9f2dc" font-size="24" font-family="'Noto Sans CJK SC',sans-serif" letter-spacing="6">OBSIDIAN WECHAT ALBUM</text>
  <text x="160" y="235" fill="#ffffff" font-size="50" font-weight="700" font-family="'Noto Serif CJK SC',serif">标签命名、层级与检索策略</text>
  <text x="160" y="283" fill="#e3eedf" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">标签不是越多越好，关键是命名稳定、颗粒度统一、能被反复检索</text>
  <rect x="160" y="298" width="320" height="8" rx="4" fill="#f4c95d"/>

  <rect x="110" y="350" width="430" height="420" rx="28" fill="#eef4e8"/>
  <text x="145" y="400" fill="#40552a" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">命名规则</text>
  <rect x="145" y="435" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="170" y="485" fill="#40552a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">统一语言和写法，避免同义词并存</text>
  <rect x="145" y="540" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="170" y="590" fill="#40552a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">优先用短词，不把句子塞进标签</text>
  <rect x="145" y="645" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="170" y="695" fill="#40552a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">定期合并近义标签和废弃标签</text>

  <rect x="570" y="350" width="430" height="420" rx="28" fill="#eef4f7"/>
  <text x="605" y="400" fill="#27435e" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">层级设计</text>
  <rect x="605" y="435" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="630" y="485" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">如 `#工作/项目A` 这种父子结构</text>
  <rect x="605" y="540" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="630" y="590" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">适合用在稳定的大类和子类</text>
  <rect x="605" y="645" width="360" height="86" rx="18" fill="#ffffff"/>
  <text x="630" y="695" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">不要把层级拆得过深影响使用</text>

  <rect x="1030" y="350" width="460" height="420" rx="28" fill="#f4efe5"/>
  <text x="1065" y="400" fill="#6f4a1f" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">检索策略</text>
  <rect x="1065" y="435" width="390" height="86" rx="18" fill="#fffdf8"/>
  <text x="1090" y="485" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">标签适合做跨文件快速聚合</text>
  <rect x="1065" y="540" width="390" height="86" rx="18" fill="#fffdf8"/>
  <text x="1090" y="590" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">和属性、路径、文件名联合搜索更强</text>
  <rect x="1065" y="645" width="390" height="86" rx="18" fill="#fffdf8"/>
  <text x="1090" y="695" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">避免把所有分类压力都压到标签上</text>
</svg>
