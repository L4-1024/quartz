<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>任务记录、聚合查询与项目汇总</title>
  <desc>Obsidian 任务中心与 Dataview 汇总示意</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2e8"/>
      <stop offset="100%" stop-color="#e4efe9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5d4b8a"/>
      <stop offset="100%" stop-color="#1f3d36"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="150" r="170" fill="#5d4b8a" opacity="0.14"/>
  <circle cx="250" cy="790" r="210" fill="#2f7f6d" opacity="0.10"/>
  <rect x="72" y="72" width="1456" height="756" rx="34" fill="#fffdf8" opacity="0.96"/>
  <rect x="110" y="110" width="1380" height="210" rx="28" fill="url(#hero)"/>
  <text x="160" y="165" fill="#ece5fb" font-size="24" font-family="'Noto Sans CJK SC',sans-serif" letter-spacing="6">OBSIDIAN WECHAT ALBUM</text>
  <text x="160" y="235" fill="#ffffff" font-size="58" font-weight="700" font-family="'Noto Serif CJK SC',serif">任务记录、聚合查询与项目汇总</text>
  <text x="160" y="283" fill="#e7f1ec" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">把分散在日记、项目笔记里的待办汇总为统一看板</text>
  <rect x="160" y="298" width="290" height="8" rx="4" fill="#f4c95d"/>

  <rect x="110" y="350" width="420" height="420" rx="28" fill="#f1edfa"/>
  <text x="145" y="400" fill="#4a3a72" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">任务来源</text>
  <rect x="145" y="435" width="350" height="78" rx="18" fill="#ffffff"/>
  <text x="170" y="482" fill="#4a3a72" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">Daily Note 临时待办</text>
  <rect x="145" y="528" width="350" height="78" rx="18" fill="#ffffff"/>
  <text x="170" y="575" fill="#4a3a72" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">项目页任务清单</text>
  <rect x="145" y="621" width="350" height="78" rx="18" fill="#ffffff"/>
  <text x="170" y="668" fill="#4a3a72" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">复盘页遗留事项</text>

  <rect x="560" y="350" width="470" height="420" rx="28" fill="#eef4f7"/>
  <text x="595" y="400" fill="#27435e" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">聚合条件</text>
  <rect x="595" y="435" width="400" height="78" rx="18" fill="#ffffff"/>
  <text x="620" y="482" fill="#27435e" font-size="19" font-family="'JetBrains Mono','Consolas',monospace">WHERE !completed</text>
  <rect x="595" y="528" width="400" height="78" rx="18" fill="#ffffff"/>
  <text x="620" y="575" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">contains(file.tags, "工作")</text>
  <rect x="595" y="621" width="400" height="78" rx="18" fill="#ffffff"/>
  <text x="620" y="668" fill="#27435e" font-size="19" font-family="'JetBrains Mono','Consolas',monospace">GROUP BY project</text>

  <rect x="1060" y="350" width="430" height="420" rx="28" fill="#ebf5ef"/>
  <text x="1095" y="400" fill="#1f5b4a" font-size="31" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">输出结果</text>
  <rect x="1095" y="435" width="360" height="88" rx="18" fill="#ffffff"/>
  <text x="1120" y="475" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">今日待办列表</text>
  <text x="1120" y="505" fill="#1f5b4a" font-size="20" font-family="'Noto Sans CJK SC',sans-serif">适合每天快速处理</text>
  <rect x="1095" y="540" width="360" height="88" rx="18" fill="#ffffff"/>
  <text x="1120" y="580" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">项目看板分组</text>
  <text x="1120" y="610" fill="#1f5b4a" font-size="20" font-family="'Noto Sans CJK SC',sans-serif">适合跟踪长期推进事项</text>
  <rect x="1095" y="645" width="360" height="88" rx="18" fill="#ffffff"/>
  <text x="1120" y="685" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">周期回顾汇总</text>
  <text x="1120" y="715" fill="#1f5b4a" font-size="20" font-family="'Noto Sans CJK SC',sans-serif">适合周回顾与月回顾</text>
</svg>
