<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f5f2ea"/>
  <text x="110" y="145" fill="#423628" font-size="54" font-family="'Noto Serif CJK SC',serif" font-weight="700">YouTube Reader 模式示意</text>
  <text x="110" y="198" fill="#796b5c" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">把视频、章节和字幕整合成一个可检索的阅读界面</text>

  <rect x="110" y="250" width="260" height="500" rx="26" fill="#ebe3d7"/>
