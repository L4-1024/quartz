  <text x="160" y="390" fill="#786856" font-size="26" font-family="'Noto Sans CJK SC',sans-serif">视频章节</text>
  <text x="160" y="440" fill="#786856" font-size="26" font-family="'Noto Sans CJK SC',sans-serif">目录跳转</text>

  <rect x="430" y="250" width="520" height="500" rx="26" fill="#20343d"/>
  <rect x="495" y="330" width="390" height="220" rx="20" fill="#2f4e5a"/>
