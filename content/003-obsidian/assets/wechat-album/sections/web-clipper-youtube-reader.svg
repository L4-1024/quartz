  <text x="1060" y="490" fill="#678077" font-size="25" font-family="'Noto Sans CJK SC',sans-serif">点击字幕跳转时间点</text>
  <text x="1060" y="540" fill="#678077" font-size="25" font-family="'Noto Sans CJK SC',sans-serif">支持高亮保存到 Obsidian</text>
