<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>公众号单篇内容的标准栏目结构</title>
  <desc>适合 Obsidian 教程衍生成公众号单篇的结构模板</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2e8"/>
      <stop offset="100%" stop-color="#e4efe9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#446a8c"/>
      <stop offset="100%" stop-color="#1f3d36"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="160" r="170" fill="#446a8c" opacity="0.12"/>
  <circle cx="220" cy="790" r="210" fill="#2f7f6d" opacity="0.08"/>
  <rect x="72" y="72" width="1456" height="756" rx="34" fill="#fffdf8" opacity="0.96"/>
  <rect x="110" y="110" width="1380" height="210" rx="28" fill="url(#hero)"/>
  <text x="160" y="165" fill="#dceaf1" font-size="24" font-family="'Noto Sans CJK SC',sans-serif" letter-spacing="6">OBSIDIAN WECHAT ALBUM</text>
  <text x="160" y="235" fill="#ffffff" font-size="50" font-weight="700" font-family="'Noto Serif CJK SC',serif">公众号单篇内容的标准栏目结构</text>
  <text x="160" y="283" fill="#e7f1ec" font-size="24" font-family="'Noto Sans CJK SC',sans-serif">让每篇推送都具备开场、结论、步骤、配图与收束，读者更容易读完</text>
  <rect x="160" y="298" width="320" height="8" rx="4" fill="#f4c95d"/>

  <rect x="110" y="380" width="250" height="270" rx="28" fill="#eef4f7"/>
  <text x="140" y="435" fill="#27435e" font-size="24" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">1. 开场问题</text>
  <text x="140" y="485" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">先讲真实场景</text>
  <text x="140" y="518" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">让用户知道为什么要继续看</text>

  <rect x="390" y="380" width="250" height="270" rx="28" fill="#ebf5ef"/>
  <text x="420" y="435" fill="#1f5b4a" font-size="24" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">2. 核心结论</text>
  <text x="420" y="485" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">用 1 到 3 句先交代答案</text>
  <text x="420" y="518" fill="#1f5b4a" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">不要等到文末才说重点</text>

  <rect x="670" y="380" width="250" height="270" rx="28" fill="#f4efe5"/>
  <text x="700" y="435" fill="#6f4a1f" font-size="24" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">3. 操作步骤</text>
  <text x="700" y="485" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">控制在 3 到 5 步</text>
  <text x="700" y="518" fill="#6f4a1f" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">每步只解决一个动作</text>

  <rect x="950" y="380" width="250" height="270" rx="28" fill="#f1edfa"/>
  <text x="980" y="435" fill="#4a3a72" font-size="24" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">4. 配图区块</text>
  <text x="980" y="485" fill="#4a3a72" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">放流程图、结构图、清单图</text>
  <text x="980" y="518" fill="#4a3a72" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">不要只放封面占位图</text>

  <rect x="1230" y="380" width="250" height="270" rx="28" fill="#eef4f7"/>
  <text x="1260" y="435" fill="#27435e" font-size="24" font-weight="700" font-family="'Noto Sans CJK SC',sans-serif">5. 收尾引导</text>
  <text x="1260" y="485" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">放相关阅读与下一篇预告</text>
  <text x="1260" y="518" fill="#27435e" font-size="19" font-family="'Noto Sans CJK SC',sans-serif">方便专辑持续追更</text>
</svg>
